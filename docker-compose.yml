# Conveniencia para rodar o build de producao em container.
# O blog nao tem dependencias externas (banco, cache): tudo e estatico.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
