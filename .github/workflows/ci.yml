name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + tsc)
        run: npm run lint

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build (SSG + search index)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://vitto-code.github.io/devlog
